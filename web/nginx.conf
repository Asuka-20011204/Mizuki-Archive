server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz { return 204; }
    location = /readyz { proxy_pass http://api:8080; }
    location /api/ {
        proxy_pass http://api:8080;
        client_max_body_size 51m;
        proxy_read_timeout 90s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
