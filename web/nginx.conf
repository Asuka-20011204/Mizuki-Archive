limit_req_zone $binary_remote_addr zone=archive_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=archive_api:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=archive_connections:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker 内置 DNS 会返回当前 api 副本；短 TTL 让副本上下线能被重新解析。
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8080;

    location = /healthz { return 204; }
    location = /readyz {
        proxy_pass $api_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 验证码和密码登录属于高成本入口，先在边缘按真实客户端地址限流，再由 API 做业务级限流。
    location ~ ^/api/(login|email/(register|login)(/request)?)$ {
        limit_req zone=archive_auth burst=6 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 8k;
        proxy_read_timeout 30s;
    }
    location /api/ {
        limit_req zone=archive_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 51m;
        proxy_read_timeout 90s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
