worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    limit_req_zone $binary_remote_addr zone=archive_auth:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=archive_api:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=archive_connections:10m;

    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8080;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
        set $api_upstream http://api:8080;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /healthz { return 204; }
        location = /readyz {
            proxy_pass $api_upstream;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ ^/api/(login|email/(register|login)(/request)?)$ {
            limit_req zone=archive_auth burst=6 nodelay;
            limit_req_status 429;
            proxy_pass $api_upstream;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            client_max_body_size 8k;
            proxy_read_timeout 30s;
        }
        location /api/ {
            limit_req zone=archive_api burst=30 nodelay;
            limit_req_status 429;
            proxy_pass $api_upstream;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            client_max_body_size 51m;
            proxy_read_timeout 90s;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
