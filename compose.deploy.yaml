name: mizuki-archive-v6

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db-access-bootstrap:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:?set MYSQL_MIGRATION_USER}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?set MYSQL_MIGRATION_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        case "$$MYSQL_DATABASE" in *[!A-Za-z0-9_]*|"") echo "invalid MYSQL_DATABASE" >&2; exit 1;; esac
        case "$$MYSQL_USER" in *[!A-Za-z0-9_]*|"") echo "invalid MYSQL_USER" >&2; exit 1;; esac
        case "$$MYSQL_MIGRATION_USER" in *[!A-Za-z0-9_]*|"") echo "invalid MYSQL_MIGRATION_USER" >&2; exit 1;; esac
        case "$$MYSQL_MIGRATION_PASSWORD" in *[!A-Za-z0-9._@#%+=:-]*|"") echo "MYSQL_MIGRATION_PASSWORD contains unsupported characters" >&2; exit 1;; esac
        mysql --protocol=tcp -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" "$$MYSQL_DATABASE" <<SQL
        CREATE USER IF NOT EXISTS '$$MYSQL_MIGRATION_USER'@'%' IDENTIFIED BY '$$MYSQL_MIGRATION_PASSWORD';
        ALTER USER '$$MYSQL_MIGRATION_USER'@'%' IDENTIFIED BY '$$MYSQL_MIGRATION_PASSWORD';
        GRANT ALL PRIVILEGES ON $$MYSQL_DATABASE.* TO '$$MYSQL_MIGRATION_USER'@'%';
        REVOKE ALL PRIVILEGES, GRANT OPTION FROM '$$MYSQL_USER'@'%';
        GRANT SELECT, INSERT, UPDATE, DELETE ON $$MYSQL_DATABASE.* TO '$$MYSQL_USER'@'%';
        FLUSH PRIVILEGES;
        SQL
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  migrate:
    image: mizuki-archive-api:local
    command: ["/app/migrate"]
    environment:
      MIGRATION_DSN: ${MYSQL_MIGRATION_USER:?set MYSQL_MIGRATION_USER}:${MYSQL_MIGRATION_PASSWORD:?set MYSQL_MIGRATION_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:?set MYSQL_DATABASE}?parseTime=true
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:?set APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD_HASH: ${APP_ADMIN_PASSWORD_HASH:?set APP_ADMIN_PASSWORD_HASH}
    depends_on:
      db-access-bootstrap:
        condition: service_completed_successfully
    restart: "no"
  api:
    build:
      context: .
      target: api
    image: mizuki-archive-api:local
    environment:
      <<: &app_environment
        APP_ORIGIN: ${DEPLOY_APP_ORIGIN:-http://localhost:18080}
        APP_LISTEN_ADDR: :8080
        APP_DATA_DIR: /srv/data/files
        APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:?set APP_ADMIN_USERNAME}
        APP_AUTO_MIGRATE: "false"
        APP_TRUST_PROXY_HEADERS: "true"
        MYSQL_DSN: ${MYSQL_USER:?set MYSQL_USER}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:?set MYSQL_DATABASE}?parseTime=true
        PROCESSING_DELIVERY_MODE: database
        PROCESSING_MAX_OUTSTANDING: ${PROCESSING_MAX_OUTSTANDING:-100}
      SMTP_HOST: ${SMTP_HOST-}
      SMTP_PORT: ${SMTP_PORT-}
      SMTP_USERNAME: ${SMTP_USERNAME-}
      SMTP_PASSWORD: ${SMTP_PASSWORD-}
      SMTP_FROM: ${SMTP_FROM-}
      EMAIL_CODE_SECRET: ${EMAIL_CODE_SECRET-}
    volumes:
      - archive_data:/srv/data
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped

  worker:
    build:
      context: .
      target: ocr-worker
    image: mizuki-archive-worker:local
    command: ["/app/worker"]
    environment:
      <<: *app_environment
      PROCESSING_WORKERS: ${PROCESSING_WORKERS:-2}
    volumes:
      - archive_data:/srv/data
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 128
    restart: unless-stopped

  web:
    build: ./web
    image: mizuki-archive-web:local
    ports:
      - "127.0.0.1:${DEPLOY_WEB_PORT:-18080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 4s
      retries: 6
    restart: unless-stopped

volumes:
  mysql_data:
  archive_data:
