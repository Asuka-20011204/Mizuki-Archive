services:
  api:
    environment:
      MYSQL_DSN: ""
      MYSQL_DSN_FILE: /run/secrets/mysql_dsn
      SMTP_PASSWORD: ""
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      EMAIL_CODE_SECRET: ""
      EMAIL_CODE_SECRET_FILE: /run/secrets/email_code_secret
    secrets:
      - mysql_dsn
      - smtp_password
      - email_code_secret

  worker:
    environment:
      MYSQL_DSN: ""
      MYSQL_DSN_FILE: /run/secrets/mysql_dsn
    secrets:
      - mysql_dsn

  migrate:
    environment:
      MIGRATION_DSN: ""
      MIGRATION_DSN_FILE: /run/secrets/migration_dsn
      APP_ADMIN_PASSWORD_HASH: ""
      APP_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
    secrets:
      - migration_dsn
      - admin_password_hash

secrets:
  mysql_dsn:
    file: ${MYSQL_DSN_SECRET_FILE:?set MYSQL_DSN_SECRET_FILE}
  migration_dsn:
    file: ${MIGRATION_DSN_SECRET_FILE:?set MIGRATION_DSN_SECRET_FILE}
  admin_password_hash:
    file: ${ADMIN_PASSWORD_HASH_SECRET_FILE:?set ADMIN_PASSWORD_HASH_SECRET_FILE}
  smtp_password:
    file: ${SMTP_PASSWORD_SECRET_FILE:?set SMTP_PASSWORD_SECRET_FILE}
  email_code_secret:
    file: ${EMAIL_CODE_SECRET_SECRET_FILE:?set EMAIL_CODE_SECRET_SECRET_FILE}
